<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -50 490 200" role="img" aria-label="POIPIU">
  <title>POIPIU</title>
  <defs>
    <linearGradient id="g0" x1="0" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF2E88"/><stop offset="1" stop-color="#00E5FF"/></linearGradient>
    <linearGradient id="g1" x1="-80" y1="0" x2="350" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF2E88"/><stop offset="1" stop-color="#00E5FF"/></linearGradient>
    <linearGradient id="g2" x1="-180" y1="0" x2="250" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF2E88"/><stop offset="1" stop-color="#00E5FF"/></linearGradient>
    <linearGradient id="g3" x1="-230" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF2E88"/><stop offset="1" stop-color="#00E5FF"/></linearGradient>
    <linearGradient id="g4" x1="-310" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF2E88"/><stop offset="1" stop-color="#00E5FF"/></linearGradient>
    <linearGradient id="g5" x1="-360" y1="0" x2="70" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF2E88"/><stop offset="1" stop-color="#00E5FF"/></linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- P -->
    <g transform="translate(0 0)"><path d="M12 98 V8 H38 A24 24 0 0 1 38 56 H12" stroke="url(#g0)" stroke-width="15"/></g>
    <!-- O: hit circle with approach ring -->
    <g transform="translate(80 0)">
      <circle cx="45" cy="53" r="48" stroke="#FF2E88" stroke-width="3" opacity="0.55" stroke-dasharray="2 9"/>
      <circle cx="45" cy="53" r="33" stroke="url(#g1)" stroke-width="15"/>
      <circle cx="45" cy="53" r="9" fill="#FFD23F" stroke="none"/>
    </g>
    <!-- I with a "punto" (point) as its dot -->
    <g transform="translate(180 0)"><path d="M20 38 V98" stroke="url(#g2)" stroke-width="15"/><circle cx="20" cy="9" r="10" fill="#FFD23F" stroke="none"/></g>
    <!-- P -->
    <g transform="translate(230 0)"><path d="M12 98 V8 H38 A24 24 0 0 1 38 56 H12" stroke="url(#g3)" stroke-width="15"/></g>
    <!-- I -->
    <g transform="translate(310 0)"><path d="M20 38 V98" stroke="url(#g4)" stroke-width="15"/><circle cx="20" cy="9" r="10" fill="#FFD23F" stroke="none"/></g>
    <!-- U -->
    <g transform="translate(360 0)"><path d="M12 8 V62 A24 24 0 0 0 60 62 V8" stroke="url(#g5)" stroke-width="15"/></g>
  </g>
</svg>
