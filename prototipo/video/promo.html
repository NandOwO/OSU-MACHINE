<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>POIPIU promo</title>
<style>
  @font-face { font-family: "PS2P"; src: url("assets/PressStart2P-Regular.ttf"); }
  html, body { margin: 0; background: #07061a; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
<!-- Generated by build.sh from private files: window.DATA (maps + replays) and window.SKINMAN (skins). -->
<script src="private/assets.js"></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
// POIPIU attract-mode promo v3: one continuous play session on the cabinet.
// Deterministic: window.renderAt(t) draws the frame at time t (seconds).
const W = 1920, H = 1080, DURATION = 80;
const C = {
  bg0: "#07061a", bg1: "#12102e", bg2: "#1e1a45",
  pink: "#ff2e88", cyan: "#00e5ff", yellow: "#ffd23f", lime: "#7cff4f",
  j100: "#4fc3f7", j50: "#ffb74d", miss: "#ff3b3b", text: "#f5f5ff", dim: "#8c88b8",
};
// Timeline (seconds).
const TL = {
  coin: 3, skin: 6.5, map: 9.5, g1: 12.5, r1: 24.5, c1: 27, g2: 29.5, r2: 41.5, c2: 44, g3: 46.5,
  r3: 58.5, rank: 63.5, prize: 69.5, cta: 74.5,
};
const GAMES = [
  { key: "deneb", skin: "whitecat", skinName: "WHITECAT", t0: TL.g1 },
  { key: "kimi", skin: "azerite", skinName: "AZERITE", t0: TL.g2 },
  { key: "shiori", skin: "btmc", skinName: "BTMC FREEDOM DIVE", t0: TL.g3 },
];
const GAME_LEN = 12;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const M = window.DATA.maps, MAN = window.SKINMAN;

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const outCubic = (t) => 1 - Math.pow(1 - clamp(t), 3);
const inOutCubic = (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const outBack = (t) => { t = clamp(t); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const fmt = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const up = (s) => String(s).toUpperCase();

function text(str, x, y, size, color, opts = {}) {
  const { align = "center", glow = 18, alpha = 1, scale = 1 } = opts;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.font = `${size}px PS2P, monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = glow;
  ctx.fillText(str, 0, 0);
  if (glow) { ctx.shadowBlur = glow / 2; ctx.fillText(str, 0, 0); }
  ctx.restore();
}
function panel(x, y, w, h, stroke = C.cyan, glow = 20, fill = "rgba(18,16,46,0.9)", r = 20) {
  ctx.save();
  ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = 4; ctx.shadowColor = stroke; ctx.shadowBlur = glow;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// ---------- results derived from the real replays ----------
function rankOf(r) {
  const n = r.objects, p300 = r.n300 / n;
  if (r.acc >= 100) return "SS";
  if (p300 > 0.9 && r.n50 / n < 0.01 && r.miss === 0) return "S";
  if ((p300 > 0.8 && r.miss === 0) || p300 > 0.9) return "A";
  if ((p300 > 0.7 && r.miss === 0) || p300 > 0.8) return "B";
  return "C";
}
const RANK_COLOR = { SS: C.yellow, S: C.yellow, A: C.lime, B: C.j100, C: C.j50 };
const EARNED = GAMES.map((g) => M[g.key].result.tickets);
const EARNED_TOTAL = EARNED.reduce((a, b) => a + b, 0);
const PRIOR = Math.ceil((3000 - EARNED_TOTAL + 30) / 10) * 10; // card balance so the prize becomes reachable
const FLY = [TL.r1 + 1.3, TL.r2 + 1.3, TL.r3 + 0.9]; // seconds when each play's tickets reach the counter
function ticketBalance(t) {
  if (t < 4.9) return 0;
  let v = PRIOR * outCubic((t - 4.9) / 0.9);
  EARNED.forEach((e, i) => { v += e * outCubic((t - FLY[i]) / 0.8); });
  if (t >= TL.prize + 3.6) v -= 3000 * outCubic((t - (TL.prize + 3.6)) / 0.9);
  return v;
}
function playsLeft(t) {
  if (t >= TL.cta + 1.9) return 3;
  if (t >= TL.g3) return 0;
  if (t >= TL.g2) return 1;
  if (t >= TL.g1) return 2;
  if (t >= 5.8) return 3;
  return 0;
}

// ---------- assets ----------
const logo = new Image(); logo.src = "../logo/poipiu-logo.svg";
const BG = {};
for (const k of Object.keys(M)) { BG[k] = new Image(); BG[k].src = `private/bg/${k}.jpg`; }
const SK = {};
const loads = [];
for (const [id, m] of Object.entries(MAN)) {
  SK[id] = { man: m, f: {} };
  for (const [key, info] of Object.entries(m.files)) {
    const img = new Image();
    img.src = `private/skins/${id}/${info.file}`;
    SK[id].f[key] = { img, ...info };
    loads.push(new Promise((res) => { img.onload = res; img.onerror = res; }));
  }
}
function drawLogo(cx, cy, width, alpha = 1) {
  if (!logo.complete) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.drawImage(logo, cx - width / 2, cy - (width * 200 / 490) / 2, width, width * 200 / 490);
  ctx.restore();
}
const tintCache = new Map();
function tinted(skinId, key, rgb) {
  const k = `${skinId}|${key}|${rgb}`;
  if (tintCache.has(k)) return tintCache.get(k);
  const f = SK[skinId].f[key];
  const c = document.createElement("canvas");
  c.width = f.w; c.height = f.h;
  const g = c.getContext("2d");
  g.drawImage(f.img, 0, 0);
  g.globalCompositeOperation = "multiply";
  g.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
  g.fillRect(0, 0, f.w, f.h);
  g.globalCompositeOperation = "destination-in";
  g.drawImage(f.img, 0, 0);
  tintCache.set(k, c);
  return c;
}
function blit(src, w, h, x, y, alpha = 1, rot = 0) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.drawImage(src, -w / 2, -h / 2, w, h);
  ctx.restore();
}
function drawCover(img, alpha = 1, blur = 0) {
  if (!img || !img.complete || !img.naturalWidth) return;
  const r = Math.max(W / img.naturalWidth, H / img.naturalHeight), w = img.naturalWidth * r, h = img.naturalHeight * r;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (blur) ctx.filter = `blur(${blur}px)`;
  ctx.drawImage(img, (W - w) / 2 - blur, (H - h) / 2 - blur, w + blur * 2, h + blur * 2);
  ctx.restore();
}
function coverTo(img, x, y, w, h, alpha = 1) {
  if (!img || !img.complete || !img.naturalWidth) return;
  const r = Math.max(w / img.naturalWidth, h / img.naturalHeight), iw = img.naturalWidth * r, ih = img.naturalHeight * r;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.clip();
  ctx.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
  ctx.restore();
}

// ---------- skin-aware osu primitives ----------
// `u` = screen pixels per 1x skin pixel, so the hit circle image spans 2R on screen.
const unit = (id, R) => { const hc = SK[id].f.hitcircle; return (2 * R) / (hc.w / hc.scale); };
const fw = (f, u) => (f.w / f.scale) * u, fh = (f, u) => (f.h / f.scale) * u;
const visible = (f) => f && !f.hidden;
function comboRGB(id, idx) { const c = SK[id].man.colors; return c[((idx % c.length) + c.length) % c.length]; }

function skinCircle(id, x, y, R, num, colorIdx, alpha = 1, scale = 1, opts = {}) {
  const s = SK[id], u = unit(id, R) * scale, rgb = comboRGB(id, colorIdx);
  const useStart = opts.head && visible(s.f.sliderstartcircle);
  const baseKey = useStart ? "sliderstartcircle" : "hitcircle";
  const ovKey = useStart ? "sliderstartcircleoverlay" : "hitcircleoverlay";
  const base = s.f[baseKey];
  blit(tinted(id, baseKey, rgb), fw(base, u), fh(base, u), x, y, alpha);
  const ov = s.f[ovKey];
  if (visible(ov) && !opts.noOverlay) blit(ov.img, fw(ov, u), fh(ov, u), x, y, alpha);
  if (num && !opts.noNumber) {
    const ds = String(num).split("").map((d) => s.f["digit" + d]);
    if (ds.every(Boolean)) {
      const dsc = u * 0.8, overlap = s.man.overlap;
      const total = ds.reduce((a, d) => a + (d.w / d.scale - overlap) * dsc, 0) + overlap * dsc;
      let cx = x - total / 2;
      for (const d of ds) { blit(d.img, fw(d, dsc), fh(d, dsc), cx + (d.w / d.scale * dsc) / 2, y, alpha); cx += (d.w / d.scale - overlap) * dsc; }
    }
  }
}
function skinApproach(id, x, y, R, k, colorIdx, alpha = 1) {
  const s = SK[id], ap = s.f.approachcircle;
  if (!ap) return;
  const u = unit(id, R) * (1 + 3 * k);
  blit(tinted(id, "approachcircle", comboRGB(id, colorIdx)), fw(ap, u), fh(ap, u), x, y, alpha);
}
function skinJudge(id, j, x, y, R, p) {
  const f = SK[id].f["hit" + j];
  if (!visible(f)) return;
  const u = unit(id, R) * 0.9, sc = 0.8 + 0.3 * outCubic(p * 3);
  blit(f.img, fw(f, u) * sc, fh(f, u) * sc, x, y + R * 0.15 * p, 1 - clamp((p - 0.55) / 0.45));
}
function skinCursor(id, x, y, trail) {
  const s = SK[id], cur = s.f.cursor, tr = s.f.cursortrail;
  trail.forEach((p, i) => {
    const a = 1 - i / trail.length;
    if (visible(tr)) blit(tr.img, fw(tr, 0.5) * (0.5 + a * 0.5), fh(tr, 0.5) * (0.5 + a * 0.5), p.x, p.y, a * 0.55);
    else { ctx.save(); ctx.globalAlpha = a * 0.4; ctx.fillStyle = "#e6fdff"; ctx.beginPath(); ctx.arc(p.x, p.y, 10 * a + 2, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  });
  if (cur) { const cs = 96 / (cur.w / cur.scale); blit(cur.img, fw(cur, cs), fh(cur, cs), x, y); }
}

// ---------- replay playback ----------
const SC = 2.0, OX = (W - 512 * SC) / 2, OY = 170;
const sx = (x) => x * SC + OX, sy = (y) => y * SC + OY;
function frameAt(frames, ms) {
  let lo = 0, hi = frames.length - 1;
  if (ms <= frames[0][0]) return { x: frames[0][1], y: frames[0][2], k: frames[0][3] };
  if (ms >= frames[hi][0]) return { x: frames[hi][1], y: frames[hi][2], k: frames[hi][3] };
  while (lo + 1 < hi) { const m = (lo + hi) >> 1; if (frames[m][0] <= ms) lo = m; else hi = m; }
  const a = frames[lo], b = frames[hi], f = (ms - a[0]) / Math.max(1, b[0] - a[0]);
  return { x: lerp(a[1], b[1], f), y: lerp(a[2], b[2], f), k: a[3] };
}
function trailAt(frames, ms, n = 12, dt = 14) {
  const out = [];
  for (let i = 1; i <= n; i++) { const p = frameAt(frames, ms - i * dt); out.push({ x: sx(p.x), y: sy(p.y) }); }
  return out;
}
const geomCache = new Map();
function sliderGeom(key, o) {
  const ck = key + o.i;
  if (geomCache.has(ck)) return geomCache.get(ck);
  const pts = o.path.map((p) => [sx(p[0]), sy(p[1])]);
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const g = { pts, cum, total: cum[cum.length - 1] };
  geomCache.set(ck, g);
  return g;
}
function sliderPos(g, frac) {
  const d = clamp(frac) * g.total;
  let lo = 0, hi = g.cum.length - 1;
  while (lo + 1 < hi) { const m = (lo + hi) >> 1; if (g.cum[m] <= d) lo = m; else hi = m; }
  const a = g.pts[lo], b = g.pts[hi], f = (d - g.cum[lo]) / Math.max(1e-6, g.cum[hi] - g.cum[lo]);
  return { x: lerp(a[0], b[0], f), y: lerp(a[1], b[1], f) };
}
function endPoint(key, o) {
  if (o.kind !== "slider") return { x: sx(o.x), y: sy(o.y) };
  return sliderPos(sliderGeom(key, o), o.slides % 2 === 1 ? 1 : 0);
}
function drawFollowPoints(key, id, ms, Rpx) {
  const fp = SK[id].f.followpoint;
  const objs = M[key].objects, pre = M[key].preempt;
  for (let n = 1; n < objs.length; n++) {
    const cur = objs[n], prev = objs[n - 1];
    if (cur.nc || ms < cur.time - pre || ms > cur.time + 100) continue;
    const a = endPoint(key, prev), b = { x: sx(cur.x), y: sy(cur.y) };
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    if (len < Rpx * 2.4) continue;
    const ang = Math.atan2(dy, dx), step = 64, count = Math.floor((len - Rpx * 2) / step);
    const p = clamp((ms - (cur.time - pre)) / pre);
    for (let k = 0; k < count; k++) {
      const f = (Rpx + (k + 0.5) * ((len - Rpx * 2) / count)) / len;
      const appear = clamp((p * 1.4 - k / Math.max(1, count)) * 3);
      const alpha = appear * (1 - clamp((ms - cur.time + 40) / 140)) * 0.85;
      if (alpha <= 0) continue;
      const x = a.x + dx * f, y = a.y + dy * f;
      if (visible(fp)) { const u = unit(id, Rpx) ; blit(fp.img, fw(fp, u), fh(fp, u), x, y, alpha, ang); }
      else { ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill(); ctx.restore(); }
    }
  }
}
function drawSliderBody(key, id, o, ms, Rpx, a) {
  const g = sliderGeom(key, o), s = SK[id], rgb = comboRGB(id, o.color), u = unit(id, Rpx);
  ctx.save();
  ctx.globalAlpha *= a;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); g.pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
  const b = s.man.sliderBorder;
  ctx.strokeStyle = `rgb(${b[0]},${b[1]},${b[2]})`; ctx.lineWidth = Rpx * 2 * 0.98; ctx.stroke();
  const tr = s.man.sliderTrack || [rgb[0] * 0.28, rgb[1] * 0.28, rgb[2] * 0.28];
  ctx.strokeStyle = `rgb(${tr[0] | 0},${tr[1] | 0},${tr[2] | 0})`; ctx.lineWidth = Rpx * 2 * 0.84; ctx.stroke();
  ctx.restore();
  // end circle: only if the skin shows one (many skins hide it with a 1x1 image)
  const ec = s.f.sliderendcircle, ep = endPoint(key, o);
  if (ec && visible(ec)) {
    blit(tinted(id, "sliderendcircle", rgb), fw(ec, u), fh(ec, u), ep.x, ep.y, a);
    const eo = s.f.sliderendcircleoverlay; if (visible(eo)) blit(eo.img, fw(eo, u), fh(eo, u), ep.x, ep.y, a);
  } else if (!ec) skinCircle(id, ep.x, ep.y, Rpx, 0, o.color, a, 1, { noNumber: true });
  // reverse arrow
  const ra = s.f.reversearrow;
  if (o.slides > 1 && visible(ra) && ms < o.end - 100) {
    const f0 = o.slides % 2 === 1 ? 0.97 : 0.03, from = sliderPos(g, f0);
    blit(ra.img, fw(ra, u), fh(ra, u), ep.x, ep.y, a * 0.9, Math.atan2(ep.y - from.y, ep.x - from.x));
  }
  // ticks
  const sp = s.f.sliderscorepoint;
  for (const e of o.events) {
    if (e.type !== "tick" || ms > e.time) continue;
    if (visible(sp)) blit(sp.img, fw(sp, u), fh(sp, u), sx(e.x), sy(e.y), a);
    else { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(sx(e.x), sy(e.y), Rpx * 0.12, 0, 7); ctx.fill(); ctx.restore(); }
  }
}
function drawSliderBall(key, id, o, ms, Rpx) {
  if (ms < o.time || ms > o.end) return;
  const g = sliderGeom(key, o), u0 = (ms - o.time) / o.spanDuration;
  const k = Math.min(Math.floor(u0), o.slides - 1);
  let f = u0 - k; if (k % 2 === 1) f = 1 - f;
  const p = sliderPos(g, f), s = SK[id], u = unit(id, Rpx), fc = s.f.sliderfollowcircle, sb = s.f.sliderb;
  if (visible(fc)) blit(fc.img, fw(fc, u), fh(fc, u), p.x, p.y, 0.9);
  if (visible(sb)) blit(sb.img, fw(sb, u), fh(sb, u), p.x, p.y);
  else { ctx.save(); ctx.fillStyle = "rgba(255,255,255,0.92)"; ctx.shadowColor = "#fff"; ctx.shadowBlur = 14; ctx.beginPath(); ctx.arc(p.x, p.y, Rpx * 0.55, 0, 7); ctx.fill(); ctx.restore(); }
}
function drawObjects(key, id, ms) {
  const m = M[key], objs = m.objects, Rpx = m.radius * SC, pre = m.preempt;
  drawFollowPoints(key, id, ms, Rpx);
  for (let n = objs.length - 1; n >= 0; n--) {
    const o = objs[n];
    if (ms < o.time - pre || ms > o.end + 700) continue;
    const alpha = clamp((ms - (o.time - pre)) / 400);
    const x = sx(o.x), y = sy(o.y), hit = o.judge > 0 ? o.hitTime : o.time + 120;
    if (o.kind === "slider") drawSliderBody(key, id, o, ms, Rpx, alpha * (1 - clamp((ms - o.end) / 160)));
    if (ms < hit) {
      skinCircle(id, x, y, Rpx, o.num, o.color, alpha, 1, { head: o.kind === "slider" });
      skinApproach(id, x, y, Rpx, clamp((o.time - ms) / pre), o.color, alpha);
    } else {
      const p = (ms - hit) / 260;
      if (p < 1) skinCircle(id, x, y, Rpx, 0, o.color, 1 - p, 1 + 0.25 * outCubic(p), { noNumber: true, head: o.kind === "slider" });
    }
    if (o.kind === "slider") drawSliderBall(key, id, o, ms, Rpx);
    const jt = o.kind === "slider" ? o.end : hit;
    if (ms >= jt && ms < jt + 650) {
      const ep = endPoint(key, o);
      skinJudge(id, o.judge, ep.x, ep.y, Rpx, (ms - jt) / 650);
    }
  }
}
// Neon sparks on every hit, in the cabinet palette (not part of the skin).
function drawSparks(key, ms) {
  const objs = M[key].objects;
  for (const o of objs) {
    if (o.judge === 0) continue;
    const jt = o.kind === "slider" ? o.end : o.hitTime;
    const p = (ms - jt) / 380;
    if (p < 0 || p > 1) continue;
    const e = endPoint(key, o), r = rng(o.i * 7919 + 13), col = o.judge === 300 ? (o.i % 2 ? C.pink : C.cyan) : o.judge === 100 ? C.j100 : C.j50;
    ctx.save(); ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 12; ctx.globalAlpha = 1 - p;
    for (let k = 0; k < 7; k++) {
      const ang = r() * Math.PI * 2, d = (40 + r() * 70) * outCubic(p);
      ctx.beginPath(); ctx.arc(e.x + Math.cos(ang) * d, e.y + Math.sin(ang) * d, 5 * (1 - p) + 1, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
}
function beatInfo(key, ms) {
  const beats = M[key].beats; let b = beats[0];
  for (const x of beats) if (x[0] <= ms) b = x;
  const ph = (((ms - b[0]) / b[1]) % 1 + 1) % 1;
  return { phase: ph, pulse: Math.pow(1 - ph, 3), n: Math.floor((ms - b[0]) / b[1]) };
}
function lastObject(key, ms) {
  let last = null;
  for (const o of M[key].objects) { if (o.end <= ms) last = o; else break; }
  return last;
}

// ---------- backgrounds ----------
function grid(t, a = 1, horizon = 700) {
  ctx.save();
  ctx.strokeStyle = "rgba(255,46,136,0.22)"; ctx.lineWidth = 2; ctx.globalAlpha = a;
  for (let i = -20; i <= 20; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * 40, horizon); ctx.lineTo(W / 2 + i * 260, H); ctx.stroke(); }
  const speed = (t * 0.6) % 1;
  for (let k = 0; k < 12; k++) { const p = (k + speed) / 12, y = horizon + Math.pow(p, 2.2) * (H - horizon); ctx.globalAlpha = a * (0.15 + p * 0.5); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
}
function menuBg(t, key = "shiori", dim = 0.8) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.bg0); g.addColorStop(1, C.bg1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  drawCover(BG[key], 1, 14);
  ctx.fillStyle = `rgba(7,6,26,${dim})`; ctx.fillRect(0, 0, W, H);
  grid(t, 0.9);
}
function ghostPlay(key, skin, ms, alpha) {
  ctx.save(); ctx.globalAlpha *= alpha;

    skinCircle(id, 0, -10, 46, i + 1, i, on ? 1 : 0.6);
    text(name.split(" ")[0], 0, 78, 13, on ? C.text : C.dim, { glow: 0 });
    ctx.restore();
  });
  text("SKIN", 360, 205, 18, C.dim, { align: "left", glow: 0 });
  // map cards
  const order = ["deneb", "kimi", "shiori"], pos = lt > 0.8 ? to : from;
  const posAnim = lerp(from, to, inOutCubic((lt - 0.7) / 0.5));
  text("MAPA", 1060, 205, 18, C.dim, { align: "left", glow: 0 });
  order.forEach((key, i) => { const d = i - posAnim; mapCard(key, 1410 + d * 330, 330, lerp(0.62, 0.42, clamp(Math.abs(d))), 1 - clamp((Math.abs(d) - 1.0) / 0.5), Math.abs(d) < 0.5); });
  void sel; void pos;
  const m = M[gt.key];
  coverTo(BG[gt.key], 360, 520, 440, 247, 1);
  text(up(m.title), 900, 560, 24, C.text, { align: "left", glow: 8 });
  text(up(m.artist), 900, 610, 18, C.dim, { align: "left", glow: 0 });
  text("[" + up(m.version) + "]", 900, 650, 18, C.cyan, { align: "left", glow: 0 });
  text("BPM " + m.bpm + "  OBJETOS " + m.totalObjects, 900, 710, 18, C.text, { align: "left", glow: 6 });
  countdown(t, t0 + 0.9, 880);
}

// ---------- scene: summary of the 3 plays ----------
function sceneSummary(t) {
  const lt = t - TL.r3;
  menuBg(t, "shiori", 0.82);
  sceneTitle("TUS 3 JUGADAS", t, TL.r3 + 0.1, C.yellow);
  GAMES.forEach((g, i) => {
    const m = M[g.key], r = m.result, p = outBack((lt - 0.2 - i * 0.2) / 0.5);
    ctx.save(); ctx.translate(0, (1 - clamp(p)) * 60); ctx.globalAlpha = clamp((lt - 0.2 - i * 0.2) / 0.3);
    const y = 270 + i * 190;
    panel(260, y - 80, 1400, 160, C.cyan, 14);
    coverTo(BG[g.key], 280, y - 64, 220, 128);
    text(up(m.title).slice(0, 26), 530, y - 36, 22, C.text, { align: "left", glow: 6 });
    text(up(m.artist) + " [" + up(m.version).slice(0, 14) + "]", 530, y + 4, 14, C.dim, { align: "left", glow: 0 });
    text("SKIN " + g.skinName.slice(0, 18), 530, y + 40, 14, C.pink, { align: "left", glow: 0 });
    const rk = rankOf(r);
    text(rk, 1150, y, 80, RANK_COLOR[rk], { glow: 24 });
    text(fmt(r.score), 1400, y - 18, 28, C.yellow, { align: "center", glow: 14 });
    text("+" + EARNED[i] + " TICKETS", 1400, y + 30, 18, C.lime, { align: "center", glow: 8 });
    ctx.restore();
  });
  const tp = outBack((lt - 1.2) / 0.5);
  text("TOTAL +" + EARNED_TOTAL + " TICKETS", W / 2, 880, 44, C.yellow, { alpha: clamp((lt - 1.2) / 0.3), scale: lerp(0.6, 1, clamp(tp)), glow: 36 });
}

// ---------- scene: ranking, POIPIU enters ----------
const BOARD_TOP = [["ACE", 3912450], ["NEKO", 3377200], ["AYA", 2891030]];
const BOARD_LOW = [["RIN", 2410870], ["SORA", 2299140], ["MOCHI", 2105500], ["TAKO", 1988400], ["LUNA", 1760230]];
const ENTRY = "POIPIU";
function drawRow(rank, name, score, y, hot) {
  ctx.save();
  ctx.fillStyle = hot ? "rgba(255,46,136,0.25)" : "rgba(30,26,69,0.88)";
  ctx.strokeStyle = hot ? C.pink : "rgba(255,255,255,0.12)"; ctx.lineWidth = hot ? 4 : 2;
  if (hot) { ctx.shadowColor = C.pink; ctx.shadowBlur = 28; }
  ctx.beginPath(); ctx.roundRect(300, y - 38, 1320, 80, 14); ctx.fill(); ctx.stroke();
  ctx.restore();
  text("#" + rank, 350, y + 2, 30, hot ? C.yellow : C.dim, { align: "left", glow: hot ? 14 : 2 });
  text(name, 560, y + 2, 34, C.text, { align: "left", glow: hot ? 16 : 4 });
  text(fmt(score), 1570, y + 2, 34, C.yellow, { align: "right", glow: hot ? 16 : 6 });
}
function sceneRank(t) {
  const lt = t - TL.rank, m = M.shiori;
  menuBg(t, "shiori", 0.82);
  ghostPlay("shiori", "azerite", (84 + lt) * 1000, 0.18);
  sceneTitle("ENTRA AL TOP 50", t, TL.rank + 0.1, C.cyan);
  text(up(m.title) + " [" + up(m.version) + "]", W / 2, 172, 18, C.dim, { glow: 0 });
  const rowH = 90, top = 250, newRank = 4, insert = clamp(outBack((lt - 0.9) / 0.7), 0, 1.12);
  BOARD_TOP.forEach((b, i) => drawRow(i + 1, b[0], b[1], top + i * rowH, false));
  BOARD_LOW.forEach((b, i) => drawRow(newRank + 1 + i, b[0], b[1], top + (newRank - 1 + i + insert) * rowH, false));
  if (lt > 0.9) {
    const ny = lerp(-120, top + (newRank - 1) * rowH, insert);
    const typed = lt > 2.0 ? clamp(Math.floor((lt - 2.0) / 0.42) + 1, 0, ENTRY.length) : 0;
    const cur = typed < ENTRY.length && Math.floor(lt * 3) % 2 === 0 ? "_" : "";
    drawRow(newRank, ENTRY.slice(0, typed) + cur, m.result.score, ny, true);
  }
  if (lt >= 4.8) {
    const q = outBack((lt - 4.8) / 0.4);
    if (lt - 4.8 < 0.15) { ctx.fillStyle = `rgba(255,210,63,${0.35 * (1 - (lt - 4.8) / 0.15)})`; ctx.fillRect(0, 0, W, H); }
    text("PUESTO #" + newRank, W / 2, 960, 56, C.yellow, { scale: lerp(0.5, 1, q), alpha: clamp((lt - 4.8) / 0.15), glow: 36 });
  }
}

// ---------- scene: prize redemption ----------
function scenePrize(t) {
  const lt = t - TL.prize;
  menuBg(t, "kimi", 0.82);
  ghostPlay("kimi", "whitecat", (60 + lt) * 1000, 0.2);
  sceneTitle("CANJEA TICKETS POR PREMIOS", t, TL.prize + 0.1, C.yellow);
  const cardX = 560, cardY = 560;
  panel(cardX - 290, cardY - 150, 580, 300, C.cyan, 24);
  text("TARJETA UID ..A3F2", cardX, cardY - 100, 22, C.dim, { glow: 4 });
  text(fmt(ticketBalance(t)), cardX, cardY - 20, 64, C.yellow, { glow: 26 });
  text("TICKETS", cardX, cardY + 50, 22, C.text, { glow: 4 });
  text("SALDO SUFICIENTE", cardX, cardY + 105, 18, C.lime, { alpha: lt > 0.6 && lt < 3.6 ? (Math.floor(lt * 3) % 2 ? 0.5 : 1) : 0, glow: 10 });
  const pp = outBack((lt - 0.4) / 0.6);
  if (lt > 0.4) {
    ctx.save(); ctx.translate(lerp(900, 0, clamp(pp)), 0); ctx.globalAlpha = clamp((lt - 0.4) / 0.3);
    panel(1000, 300, 640, 520, C.pink, 26);
    ctx.fillStyle = C.bg2; ctx.strokeStyle = C.cyan; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.roundRect(1200, 420, 240, 260, 40); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.cyan; ctx.beginPath(); ctx.arc(1260, 520, 20, 0, 7); ctx.arc(1380, 520, 20, 0, 7); ctx.fill();
    text("FUNKO POP", 1320, 345, 34, C.text, {});
    text("3 000 TICKETS", 1320, 745, 30, C.yellow, {});
    ctx.restore();
  }
  // redemption: tickets fly from the card to the prize
  const rd = lt - 3.2;
  if (rd > 0 && rd < 1.4) for (let i = 0; i < 16; i++) { const q = clamp(rd / 1.0 - i * 0.04); if (q > 0 && q < 1) ticketShape(lerp(cardX + 140, 1320, outCubic(q)), lerp(cardY, 560, outCubic(q)) - Math.sin(q * Math.PI) * 120, (i - 8) * 0.12, 1 - clamp((q - 0.85) * 6)); }
  if (lt > 4.2) text("CANJEADO!", 1320, 790, 26, C.lime, { alpha: Math.floor(lt * 4) % 2 ? 0.5 : 1, glow: 22 });
  // printed strip at the bottom
  if (lt > 3.3) { const h = 90 * outCubic((lt - 3.3) / 1.0); ctx.save(); ctx.fillStyle = C.yellow; ctx.shadowColor = C.yellow; ctx.shadowBlur = 16; ctx.fillRect(W - 360, H - 56 - h, 120, h); ctx.restore(); }
}

// ---------- scene: call to action ----------
function sceneCta(t) {
  const lt = t - TL.cta;
  menuBg(t, "shiori", 0.78);
  ghostPlay("shiori", "btmc", (48 + lt) * 1000, 0.3);
  drawLogo(W / 2, 330, 1000, clamp(lt / 0.4));
  const on = Math.floor(lt * 2) % 2 === 0 || lt < 0.5;
  text("INSERT COIN", W / 2, 590, 80, C.yellow, { alpha: on ? 1 : 0.15, glow: 40 });
  text("PASA TU TARJETA", W / 2, 700, 40, C.cyan, { alpha: on ? 1 : 0.15 });
  text("SIGUE EL RITMO. SUMA PUNTOS. GANA PREMIOS.", W / 2, 800, 24, C.text, { glow: 12, alpha: clamp((lt - 0.8) / 0.4) });
  const slx = 1560, sly = 560;
  ctx.save(); ctx.fillStyle = C.bg1; ctx.strokeStyle = C.pink; ctx.lineWidth = 5; ctx.shadowColor = C.pink; ctx.shadowBlur = 24 + 12 * Math.sin(lt * 6);
  ctx.beginPath(); ctx.roundRect(slx - 90, sly - 130, 180, 320, 20); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#000"; ctx.fillRect(slx - 8, sly - 20, 16, 90); ctx.restore();
  text("COIN", slx, sly - 90, 20, C.pink, { glow: 8 });
  const coins = [TL.cta + 1.4, TL.cta + 3.0];
  for (const t0 of coins) {
    const p = (t - t0) / 0.45;
    if (p >= 0 && p < 1) {
      const y = lerp(sly - 330, sly + 10, p * p);
      ctx.save(); ctx.fillStyle = C.yellow; ctx.shadowColor = C.yellow; ctx.shadowBlur = 20; ctx.globalAlpha = 1 - clamp((p - 0.85) / 0.15);
      ctx.beginPath(); ctx.ellipse(slx, y, 34 * (0.4 + 0.6 * Math.abs(Math.cos(p * 9))), 34, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    if (t >= t0 + 0.45 && t < t0 + 0.8) { ctx.fillStyle = `rgba(255,210,63,${0.25 * (1 - (t - t0 - 0.45) / 0.35)})`; ctx.fillRect(0, 0, W, H); }
  }
  const credits = coins.filter((c) => t >= c + 0.45).length;
  text("CREDITOS: " + credits * 3, 190, H - 100, 26, C.yellow, { align: "left" });
}

// ---------- compositor ----------
const CUTS = [TL.coin, TL.skin, TL.map, TL.g1, TL.r1, TL.c1, TL.g2, TL.r2, TL.c2, TL.g3, TL.r3, TL.rank, TL.prize, TL.cta];
function wipe(t) {
  for (const b of CUTS) {
    const p = (t - (b - 0.18)) / 0.36;
    if (p > 0 && p < 1) {
      const x = -W + p * 2 * W, g = ctx.createLinearGradient(x, 0, x + W, 0);
      g.addColorStop(0, C.pink); g.addColorStop(0.7, C.pink); g.addColorStop(1, C.cyan);
      ctx.save(); ctx.fillStyle = g; ctx.fillRect(x, 0, W, H); ctx.restore();
    }
  }
}
window.renderAt = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  let label = "";
  let beat = 0;
  if (t < TL.coin) sceneIntro(t);
  else {
    if (t < TL.skin) { sceneCoin(t); label = "BIENVENIDO"; }
    else if (t < TL.map) { sceneSkin(t); label = "SKIN"; }
    else if (t < TL.g1) { sceneMap(t); label = "MAPA"; }
    else if (t < TL.r1) { label = sceneGame(t, 0); beat = beatInfo("deneb", (M.deneb.play.r0 + t - TL.g1) * 1000).pulse; }
    else if (t < TL.c1) { sceneResult(t, 0, TL.r1); label = "RESULTADO"; }
    else if (t < TL.g2) { sceneChange(t, TL.c1, 0, 1); label = "SIGUIENTE"; }
    else if (t < TL.r2) { label = sceneGame(t, 1); beat = beatInfo("kimi", (M.kimi.play.r0 + t - TL.g2) * 1000).pulse; }
    else if (t < TL.c2) { sceneResult(t, 1, TL.r2); label = "RESULTADO"; }
    else if (t < TL.g3) { sceneChange(t, TL.c2, 1, 2); label = "SIGUIENTE"; }
    else if (t < TL.r3) { label = sceneGame(t, 2); beat = beatInfo("shiori", (M.shiori.play.r0 + t - TL.g3) * 1000).pulse; }
    else if (t < TL.rank) { sceneSummary(t); label = "RESUMEN"; }
    else if (t < TL.prize) { sceneRank(t); label = "TOP 50"; }
    else if (t < TL.cta) { scenePrize(t); label = "PREMIOS"; }
    else { sceneCta(t); label = "POIPIU"; }
    cabinet(t, label, beat);
  }
  wipe(t);
  overlayFx();
  const f = Math.min(clamp(t / 0.25), clamp((DURATION - t) / 0.5));
  if (f < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - f})`; ctx.fillRect(0, 0, W, H); }
};
window.ready = Promise.all([
  document.fonts.load("40px PS2P"),
  new Promise((res) => { if (logo.complete) res(); else logo.onload = res; }),
  ...Object.values(BG).map((i) => new Promise((res) => { if (i.complete) res(); else { i.onload = res; i.onerror = res; } })),
  ...loads,
]).then(() => { window.renderAt(0); return true; });
</script>
</body>
