<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>POIPIU promo</title>
<style>
  @font-face { font-family: "PS2P"; src: url("assets/PressStart2P-Regular.ttf"); }
  html, body { margin: 0; background: #07061a; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
<!-- Generated by build.sh from private files: window.DATA (replays + map) and window.SKINMAN (skins). -->
<script src="private/assets.js"></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
// POIPIU attract-mode promo v2. Deterministic: window.renderAt(t) draws the frame at time t (seconds).
const W = 1920, H = 1080, DURATION = 40;
const C = {
  bg0: "#07061a", bg1: "#12102e", bg2: "#1e1a45",
  pink: "#ff2e88", cyan: "#00e5ff", yellow: "#ffd23f", lime: "#7cff4f",
  j100: "#4fc3f7", j50: "#ffb74d", miss: "#ff3b3b", text: "#f5f5ff", dim: "#8c88b8",
};
// Scene boundaries (seconds).
const T = { play: 3, score: 11, skins: 16, rank: 21, tickets: 28, cta: 35 };
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const D = window.DATA, MAN = window.SKINMAN;

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const outCubic = (t) => 1 - Math.pow(1 - clamp(t), 3);
const inOutCubic = (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const outBack = (t) => { t = clamp(t); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const fmt = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");

function text(str, x, y, size, color, opts = {}) {
  const { align = "center", glow = 18, alpha = 1, scale = 1 } = opts;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.font = `${size}px PS2P, monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = glow;
  ctx.fillText(str, 0, 0);
  ctx.shadowBlur = glow / 2;
  ctx.fillText(str, 0, 0);
  ctx.restore();
}

// ---------- assets ----------
const logo = new Image();
logo.src = "../logo/poipiu-logo.svg";
const bgImg = new Image();
bgImg.src = "private/bg/deneb.jpg";
const SK = {};
const loads = [];
for (const [id, m] of Object.entries(MAN)) {
  SK[id] = { man: m, f: {} };
  for (const [key, info] of Object.entries(m.files)) {
    const img = new Image();
    img.src = `private/skins/${id}/${info.file}`;
    SK[id].f[key] = { img, ...info };
    loads.push(new Promise((res) => { img.onload = res; img.onerror = res; }));
  }
}
function drawLogo(cx, cy, width, alpha = 1) {
  if (!logo.complete) return;
  const h = width * (200 / 490);
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.drawImage(logo, cx - width / 2, cy - h / 2, width, h);
  ctx.restore();
}
const tintCache = new Map();
function tinted(skinId, key, rgb) {
  const k = `${skinId}|${key}|${rgb}`;
  if (tintCache.has(k)) return tintCache.get(k);
  const f = SK[skinId].f[key];
  const c = document.createElement("canvas");
  c.width = f.w; c.height = f.h;
  const g = c.getContext("2d");
  g.drawImage(f.img, 0, 0);
  g.globalCompositeOperation = "multiply";
  g.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
  g.fillRect(0, 0, f.w, f.h);
  g.globalCompositeOperation = "destination-in";
  g.drawImage(f.img, 0, 0);
  tintCache.set(k, c);
  return c;
}
function blit(src, w, h, x, y, alpha = 1, rot = 0) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.drawImage(src, -w / 2, -h / 2, w, h);
  ctx.restore();
}

// ---------- skin-aware osu primitives ----------
// `u` = pixels per skin-image pixel, so the circle image spans 2R on screen.
function skinCircle(id, x, y, R, num, colorIdx, alpha = 1, scale = 1, opts = {}) {
  const s = SK[id], hc = s.f.hitcircle;
  if (!hc) return;
  const colors = s.man.colors, rgb = colors[((colorIdx % colors.length) + colors.length) % colors.length];
  const u = (2 * R) / hc.w * scale;
  blit(tinted(id, "hitcircle", rgb), hc.w * u, hc.h * u, x, y, alpha);
  const ov = s.f.hitcircleoverlay;
  if (ov && !opts.noOverlay) blit(ov.img, ov.w * u, ov.h * u, x, y, alpha);
  if (num && !opts.noNumber) {
    const str = String(num), ds = str.split("").map((d) => s.f["digit" + d]);
    if (ds.every(Boolean)) {
      const dsc = u * 0.78;
      const overlap = s.man.overlap * (ds[0].scale || 1);
      const total = ds.reduce((a, d) => a + (d.w - overlap) * dsc, 0) + overlap * dsc;
      let cx = x - total / 2;
      for (const d of ds) { blit(d.img, d.w * dsc, d.h * dsc, cx + (d.w * dsc) / 2, y, alpha); cx += (d.w - overlap) * dsc; }
    }
  }
}
function skinApproach(id, x, y, R, k, colorIdx, alpha = 1) {
  const s = SK[id], ap = s.f.approachcircle, hc = s.f.hitcircle;
  if (!ap || !hc) return;
  const colors = s.man.colors, rgb = colors[((colorIdx % colors.length) + colors.length) % colors.length];
  const u = (2 * R) / hc.w * (1 + 3 * k);
  blit(tinted(id, "approachcircle", rgb), ap.w * u, ap.h * u, x, y, alpha);
}
function skinJudge(id, j, x, y, R, p) {
  const f = SK[id].f["hit" + j];
  if (!f || f.hidden) return;
  const hc = SK[id].f.hitcircle;
  const u = (2 * R) / hc.w * 0.9;
  const s = 0.8 + 0.3 * outCubic(p * 3);
  blit(f.img, f.w * u * s, f.h * u * s, x, y + R * 0.15 * p, 1 - clamp((p - 0.55) / 0.45));
}
function skinCursor(id, x, y, trailPts) {
  const s = SK[id], cur = s.f.cursor, tr = s.f.cursortrail;
  ctx.save();
  trailPts.forEach((p, i) => {
    const a = (1 - i / trailPts.length);
    if (tr && !tr.hidden) blit(tr.img, tr.w * 0.5 * (0.5 + a * 0.5), tr.h * 0.5 * (0.5 + a * 0.5), p.x, p.y, a * 0.55);
    else { ctx.globalAlpha = a * 0.4; ctx.fillStyle = "#e6fdff"; ctx.beginPath(); ctx.arc(p.x, p.y, 10 * a + 2, 0, Math.PI * 2); ctx.fill(); }
  });
  ctx.restore();
  if (cur) { const cs = 96 / (cur.w / (cur.scale || 1)); blit(cur.img, cur.w * cs / (cur.scale || 1), cur.h * cs / (cur.scale || 1), x, y); }
}

// ---------- replay playback ----------
const SC = 2.0, OX = (W - 512 * SC) / 2, OY = 170;
const sx = (x) => x * SC + OX, sy = (y) => y * SC + OY;
function frameAt(frames, ms) {
  let lo = 0, hi = frames.length - 1;
  if (ms <= frames[0][0]) return { x: frames[0][1], y: frames[0][2], k: frames[0][3] };
  if (ms >= frames[hi][0]) return { x: frames[hi][1], y: frames[hi][2], k: frames[hi][3] };
  while (lo + 1 < hi) { const m = (lo + hi) >> 1; if (frames[m][0] <= ms) lo = m; else hi = m; }
  const a = frames[lo], b = frames[hi], f = (ms - a[0]) / Math.max(1, b[0] - a[0]);
  return { x: lerp(a[1], b[1], f), y: lerp(a[2], b[2], f), k: a[3] };
}
function trailAt(frames, ms, n = 12, dt = 14) {
  const out = [];
  for (let i = 1; i <= n; i++) { const p = frameAt(frames, ms - i * dt); out.push({ x: sx(p.x), y: sy(p.y) }); }
  return out;
}
// Presses (rising edges) of each ghost replay, used to reconstruct approximate circles.
function presses(frames) {
  const out = []; let prev = 0;
  for (const f of frames) { const k = f[3] & 15; if (k & ~prev) out.push([f[0], f[1], f[2]]); prev = k; }
  return out;
}
const GHOST = { kimi: presses(D.kimi.frames), shiori: presses(D.shiori.frames) };

const PRE = 600; // approach time, AR 9
const cache = new Map();
function sliderGeom(o) {
  if (cache.has(o.i)) return cache.get(o.i);
  const pts = o.path.map((p) => [sx(p[0]), sy(p[1])]);
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const g = { pts, cum, total: cum[cum.length - 1] };
  cache.set(o.i, g);
  return g;
}
function sliderPos(g, frac) {
  const d = clamp(frac) * g.total;
  let lo = 0, hi = g.cum.length - 1;
  while (lo + 1 < hi) { const m = (lo + hi) >> 1; if (g.cum[m] <= d) lo = m; else hi = m; }
  const a = g.pts[lo], b = g.pts[hi], f = (d - g.cum[lo]) / Math.max(1e-6, g.cum[hi] - g.cum[lo]);
  return { x: lerp(a[0], b[0], f), y: lerp(a[1], b[1], f), ang: Math.atan2(b[1] - a[1], b[0] - a[0]) };
}
function drawSlider(id, o, ms, Rpx) {
  const g = sliderGeom(o), s = SK[id], colors = s.man.colors, rgb = colors[o.color % colors.length];
  const fadeIn = clamp((ms - (o.time - PRE)) / 400), fadeOut = 1 - clamp((ms - o.end) / 160);
  const a = fadeIn * fadeOut;
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha *= a;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); g.pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
  const b = s.man.sliderBorder;
  ctx.strokeStyle = `rgb(${b[0]},${b[1]},${b[2]})`; ctx.lineWidth = Rpx * 2 * 0.98; ctx.stroke();
  const tr = s.man.sliderTrack || [rgb[0] * 0.28, rgb[1] * 0.28, rgb[2] * 0.28];
  ctx.strokeStyle = `rgb(${tr[0] | 0},${tr[1] | 0},${tr[2] | 0})`; ctx.lineWidth = Rpx * 2 * 0.84; ctx.stroke();
  ctx.restore();
  // end marker (tinted circle), reverse arrow for repeats
  const endFrac = o.slides % 2 === 1 ? 1 : 0;
  const ep = sliderPos(g, endFrac);
  skinCircle(id, ep.x, ep.y, Rpx, 0, o.color, a, 1, { noNumber: true });
  const ra = s.f.reversearrow;
  if (o.slides > 1 && ra && ms < o.end - 100) {
    const dir = sliderPos(g, endFrac ? 0.98 : 0.02), ang = Math.atan2(ep.y - dir.y, ep.x - dir.x);
    const hc = s.f.hitcircle, u = (2 * Rpx) / hc.w;
    blit(ra.img, ra.w * u, ra.h * u, ep.x, ep.y, a * 0.9, ang);
  }
  // ticks
  for (const e of o.events) {
    if (e.type !== "tick" || ms > e.time) continue;
    ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(sx(e.x), sy(e.y), Rpx * 0.12, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
}
function drawSliderBall(id, o, ms, Rpx) {
  if (ms < o.time || ms > o.end) return;
  const g = sliderGeom(o), sd = o.spanDuration, u = (ms - o.time) / sd;
  const k = Math.min(Math.floor(u), o.slides - 1);
  let f = u - k; if (k % 2 === 1) f = 1 - f;
  const p = sliderPos(g, f), s = SK[id], fc = s.f.sliderfollowcircle, hc = s.f.hitcircle;
  const un = (2 * Rpx) / hc.w;
  if (fc) blit(fc.img, fc.w * un, fc.h * un, p.x, p.y, 0.9);
  ctx.save(); ctx.fillStyle = "rgba(255,255,255,0.92)"; ctx.shadowColor = "#fff"; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(p.x, p.y, Rpx * 0.55, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function drawDenebObjects(id, ms, Rpx) {
  const objs = D.deneb.objects;
  for (let n = objs.length - 1; n >= 0; n--) {
    const o = objs[n];
    if (ms < o.time - PRE || ms > o.end + 700) continue;
    const alpha = clamp((ms - (o.time - PRE)) / 400);
    if (o.kind === "slider") drawSlider(id, o, ms, Rpx);
    const x = sx(o.x), y = sy(o.y);
    const hit = o.judge > 0 ? o.hitTime : o.time + 120;
    if (ms < hit) {
      skinCircle(id, x, y, Rpx, o.num, o.color, alpha);
      skinApproach(id, x, y, Rpx, clamp((o.time - ms) / PRE), o.color, alpha);
    } else if (o.kind === "circle" || o.kind === "slider") {
      const p = (ms - hit) / 260;
      if (p < 1) skinCircle(id, x, y, Rpx, o.num, o.color, 1 - p, 1 + 0.25 * outCubic(p), { noNumber: true });
    }
    if (o.kind === "slider") drawSliderBall(id, o, ms, Rpx);
    const jt = o.kind === "slider" ? o.end : hit;
    if (ms >= jt && ms < jt + 650) {
      const ep = o.kind === "slider" ? (() => { const q = sliderPos(sliderGeom(o), o.slides % 2 === 1 ? 1 : 0); return { x: q.x, y: q.y }; })() : { x, y };
      skinJudge(id, o.judge, ep.x, ep.y, Rpx, (ms - jt) / 650);
    }
  }
}
// Approximate ghost: circles reconstructed from the press events of a real replay.
function drawGhost(name, ms, id, alpha, scale = 1) {
  const list = GHOST[name], fr = D[name].frames, Rpx = 37.4 * SC * scale;
  ctx.save();
  ctx.globalAlpha *= alpha;
  for (let n = list.length - 1; n >= 0; n--) {
    const p = list[n];
    if (ms < p[0] - PRE || ms > p[0] + 300) continue;
    const x = sx(p[1]), y = sy(p[2]), a = clamp((ms - (p[0] - PRE)) / 300);
    if (ms < p[0]) { skinCircle(id, x, y, Rpx, (n % 9) + 1, Math.floor(n / 9), a); skinApproach(id, x, y, Rpx, (p[0] - ms) / PRE, Math.floor(n / 9), a); }
    else { const q = (ms - p[0]) / 300; skinCircle(id, x, y, Rpx, 0, Math.floor(n / 9), 1 - q, 1 + 0.25 * q, { noNumber: true }); }
  }
  const c = frameAt(fr, ms);
  skinCursor(id, sx(c.x), sy(c.y), trailAt(fr, ms));
  ctx.restore();
}

// ---------- background ----------
function drawCover(img, alpha = 1, blur = 0) {
  if (!img.complete || !img.naturalWidth) return;
  const r = Math.max(W / img.naturalWidth, H / img.naturalHeight), w = img.naturalWidth * r, h = img.naturalHeight * r;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (blur) ctx.filter = `blur(${blur}px)`;
  ctx.drawImage(img, (W - w) / 2 - blur, (H - h) / 2 - blur, w + blur * 2, h + blur * 2);
  ctx.restore();
}
function grid(t, a = 1) {
  ctx.save();
  ctx.strokeStyle = "rgba(255,46,136,0.22)"; ctx.lineWidth = 2; ctx.globalAlpha = a;
  const horizon = 700;
  for (let i = -20; i <= 20; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * 40, horizon); ctx.lineTo(W / 2 + i * 260, H); ctx.stroke(); }
  const speed = (t * 0.6) % 1;
  for (let k = 0; k < 12; k++) { const p = (k + speed) / 12, y = horizon + Math.pow(p, 2.2) * (H - horizon); ctx.globalAlpha = a * (0.15 + p * 0.5); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
}
function background(t, mode) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.bg0); g.addColorStop(1, C.bg1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (mode === "play") { drawCover(bgImg, 1); ctx.fillStyle = "rgba(7,6,26,0.62)"; ctx.fillRect(0, 0, W, H); }
  else { drawCover(bgImg, 1, 14); ctx.fillStyle = "rgba(7,6,26,0.80)"; ctx.fillRect(0, 0, W, H); grid(t, 0.9); }
}
function overlay() {
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1.5);
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.95);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.55)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
function title(str, t, t0, color = C.cyan) {
  const p = outBack((t - t0) / 0.5);
  text(str, W / 2, 80, 42, color, { scale: lerp(0.6, 1, p), alpha: clamp((t - t0) / 0.25) });
}

// ---------- scene 1: intro ----------
function ringCircle(x, y, r, color, w = 8, a = 1) {
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.shadowColor = color; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}
function scene1(t) {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  const hit = 1.5;
  if (t < hit) {
    const k = (hit - t) / hit;
    ringCircle(W / 2, H / 2, 130 * (1 + 1.6 * k), C.pink, 7);
    ringCircle(W / 2, H / 2, 130, C.cyan, 14, clamp(t / 0.6));
  } else {
    const p = (t - hit) / 0.5;
    ringCircle(W / 2, H / 2, 130 + 900 * outCubic(p), C.cyan, 8, 1 - clamp(p));
    const flash = 1 - clamp((t - hit) / 0.25);
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.6})`; ctx.fillRect(0, 0, W, H); }
    const lp = outBack((t - hit) / 0.6);
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(lerp(0.4, 1, lp), lerp(0.4, 1, lp)); ctx.translate(-W / 2, -H / 2);
    drawLogo(W / 2, H / 2, 1300, clamp((t - hit) / 0.2));
    ctx.restore();
  }
}

// ---------- scene 2: real gameplay (Deneb to Spica replay), skins swap ----------
const PLAY_SKINS = [["whitecat", "WHITECAT"], ["azerite", "AZERITE"], ["btmc", "BTMC FREEDOM DIVE"]];
function scene2(t) {
  const lt = t - T.play, ms = (D.deneb.R0 + lt) * 1000, Rpx = D.deneb.radius * SC;
  const idx = Math.min(2, Math.floor(lt / (8 / 3))), [sid, sname] = PLAY_SKINS[idx];
  drawDenebObjects(sid, ms, Rpx);
  const fr = D.deneb.frames, c = frameAt(fr, ms);
  skinCursor(sid, sx(c.x), sy(c.y), trailAt(fr, ms));
  // HUD from the real replay values
  let last = D.deneb.objects[0];
  for (const o of D.deneb.objects) if (o.end <= ms) last = o;
  text("SCORE", 110, 100, 22, C.dim, { align: "left", glow: 4 });
  text(String(last.scoreAfter).padStart(8, "0"), 110, 150, 42, C.yellow, { align: "left" });
  text(D.denebResult.player.toUpperCase(), W - 110, 100, 26, C.cyan, { align: "right", glow: 10 });
  text("COMBO", 110, H - 150, 22, C.dim, { align: "left", glow: 4 });
  const pulse = 1 + 0.2 * Math.max(0, 1 - ((ms - last.end) / 140));
  text("x" + last.comboAfter, 110, H - 95, 64, C.cyan, { align: "left", scale: pulse });
  // skin label + swap flash
  const since = lt - idx * (8 / 3);
  text("SKIN", W - 110, H - 150, 22, C.dim, { align: "right", glow: 4 });
  text(sname, W - 110, H - 100, 28, C.text, { align: "right", glow: 22, scale: lerp(1.25, 1, outCubic(since / 0.4)) });
  if (idx > 0 && since < 0.18) { ctx.fillStyle = `rgba(255,255,255,${0.5 * (1 - since / 0.18)})`; ctx.fillRect(0, 0, W, H); }
  title("SIGUE EL RITMO", t, T.play + 0.1);
  ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(448, H - 60, 1024, 8);
  ctx.fillStyle = C.pink; ctx.fillRect(448, H - 60, 1024 * clamp(lt / 8), 8);
}

// ---------- scene 3: results of the two real replays ----------
function rankOf(r) {
  const n = r.objects, p300 = r.n300 / n;
  if (r.acc === 100) return "SS";
  if (p300 > 0.9 && r.n50 / n < 0.01 && r.miss === 0) return "S";
  if ((p300 > 0.8 && r.miss === 0) || p300 > 0.9) return "A";
  if ((p300 > 0.7 && r.miss === 0) || p300 > 0.8) return "B";
  return "C";
}
const RANK_COLOR = { SS: C.yellow, S: C.yellow, A: C.lime, B: C.j100, C: C.j50 };
function resultCard(r, label1, label2, x, y, t, t0) {
  const p = outBack((t - t0) / 0.6), a = clamp((t - t0) / 0.25);
  if (a <= 0) return;
  ctx.save();
  ctx.translate((1 - p) * (x < W / 2 ? -700 : 700), 0);
  ctx.globalAlpha = a;
  ctx.fillStyle = "rgba(18,16,46,0.92)"; ctx.strokeStyle = C.cyan; ctx.lineWidth = 4; ctx.shadowColor = C.cyan; ctx.shadowBlur = 22;
  ctx.beginPath(); ctx.roundRect(x - 400, y, 800, 700, 24); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.translate((1 - p) * (x < W / 2 ? -700 : 700), 0); ctx.globalAlpha = a;
  const cx = x, k = outCubic((t - t0 - 0.5) / 2.6);
  text(label1, cx, y + 56, 26, C.text, { glow: 8 });
  text(label2, cx, y + 98, 18, C.dim, { glow: 2 });
  const rk = rankOf(r);
  text(rk, cx - 250, y + 270, 150, RANK_COLOR[rk], { glow: 40 });
  text(fmt(r.score * k), cx + 130, y + 215, 46, C.yellow, { glow: 24 });
  text("PUNTOS", cx + 130, y + 270, 20, C.text, { glow: 4 });
  text("ACC " + (r.acc * k).toFixed(2) + "%", cx + 130, y + 330, 28, C.lime, { glow: 12 });
  text("COMBO x" + Math.round(r.maxCombo * k), cx, y + 440, 34, C.cyan, { glow: 12 });
  const cols = [["300", r.n300, C.lime], ["100", r.n100, C.j100], ["50", r.n50, C.j50], ["MISS", r.miss, C.miss]];
  cols.forEach((c, i) => { const xx = cx - 270 + i * 180; text(c[0], xx, y + 540, 24, c[2], { glow: 8 }); text(String(Math.round(c[1] * k)), xx, y + 600, 34, C.text, { glow: 6 }); });
  ctx.restore();
}
function scene3(t) {
  drawGhost("shiori", (60 + (t - T.score)) * 1000, "azerite", 0.35);
  title("SUMA PUNTOS", t, T.score + 0.1, C.yellow);
  resultCard({ ...D.kimi, rankKey: 0 }, "KIMI NO SEI (TV SIZE)", "NINOS INSANE", 520, 180, t, T.score + 0.2);
  resultCard({ ...D.shiori, rankKey: 1 }, "SHIORI VS. HITORIGOTO", "INSANE", 1400, 180, t, T.score + 0.45);
}

// ---------- scene 4: the three real skins ----------
function scene4(t) {
  title("ELIGE TU SKIN", t, T.skins + 0.1, C.pink);
  const lt = t - T.skins, sel = Math.min(2, Math.floor(lt / 1.7));
  const cards = [["whitecat", "WHITECAT", 410], ["azerite", "AZERITE", 960], ["btmc", "BTMC FREEDOM DIVE", 1510]];
  cards.forEach(([id, name, cx], i) => {
    const on = i === sel, p = outBack((lt - 0.15 * i) / 0.5), sc = (on ? 1.05 : 0.96) * lerp(0.7, 1, clamp(p));
    ctx.save();
    ctx.translate(cx, 560); ctx.scale(sc, sc); ctx.globalAlpha = clamp((lt - 0.15 * i) / 0.25) * (on ? 1 : 0.6);
    ctx.fillStyle = "rgba(18,16,46,0.94)"; ctx.strokeStyle = on ? C.pink : "rgba(255,255,255,0.18)"; ctx.lineWidth = on ? 6 : 3;
    ctx.shadowColor = on ? C.pink : "transparent"; ctx.shadowBlur = on ? 30 : 0;
    ctx.beginPath(); ctx.roundRect(-250, -330, 500, 660, 22); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.translate(cx, 560); ctx.scale(sc, sc); ctx.globalAlpha = clamp((lt - 0.15 * i) / 0.25) * (on ? 1 : 0.6);
    ctx.beginPath(); ctx.roundRect(-250, -330, 500, 660, 22); ctx.clip();
    text(name, 0, -285, name.length > 12 ? 20 : 26, C.text, { glow: 8 });
    text(("POR " + MAN[id].author).slice(0, 26).toUpperCase(), 0, -245, 14, C.dim, { glow: 0 });
    const loop = ((lt * 0.9 + i * 0.3) % 1);
    const row = [[-130, -120], [0, -40], [130, -120]];
    row.forEach(([ox, oy], n) => {
      skinCircle(id, ox, oy, 62, n + 1, n, 1);
      skinApproach(id, ox, oy, 62, 1 - ((loop + n * 0.33) % 1), n, 0.9);
    });
    const cur = SK[id].f.cursor;
    if (cur) { const cs = 96 / (cur.w / (cur.scale || 1)); blit(cur.img, cur.w * cs / (cur.scale || 1), cur.h * cs / (cur.scale || 1), 40, -10); }
    const js = [["100", -150], ["50", -50], ["0", 50]];
    js.forEach(([j, ox]) => { const f = SK[id].f["hit" + j]; if (f && !f.hidden) { const sc2 = 70 / f.w; blit(f.img, f.w * sc2, f.h * sc2, ox + 20, 130); } });
    text("300", 140, 130, 22, C.lime, { glow: 10 });
    ctx.restore();
  });
  // arrows + file hint
  ctx.fillStyle = C.cyan; ctx.shadowColor = C.cyan; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.moveTo(90, 560); ctx.lineTo(140, 525); ctx.lineTo(140, 595); ctx.fill();
  ctx.beginPath(); ctx.moveTo(1830, 560); ctx.lineTo(1780, 525); ctx.lineTo(1780, 595); ctx.fill();
  ctx.shadowBlur = 0;
  text("IMPORTA TU SKIN .OSK / .OSZ", W / 2, 960, 26, C.yellow, { alpha: Math.floor(lt * 2) % 2 ? 0.55 : 1 });
}

// ---------- scene 5: ranking, THERICKS enters at #4 ----------
const BOARD_TOP = [["KAT", 3912450], ["NEKO", 3377200], ["AYA", 2891030]];
const BOARD_LOW = [["RIZIA", 2410870], ["ERISU", 2299140], ["HITOMI", 2105500], ["L1GHT", 1988400], ["ENNEYA", 1760230]];
const NAME = D.shiori.player.toUpperCase().slice(0, 8);
function drawRow(rank, name, score, y, hot) {
  ctx.save();
  ctx.fillStyle = hot ? "rgba(255,46,136,0.25)" : "rgba(30,26,69,0.88)";
  ctx.strokeStyle = hot ? C.pink : "rgba(255,255,255,0.12)"; ctx.lineWidth = hot ? 4 : 2;
  if (hot) { ctx.shadowColor = C.pink; ctx.shadowBlur = 28; }
  ctx.beginPath(); ctx.roundRect(300, y - 38, 1320, 80, 14); ctx.fill(); ctx.stroke();
  ctx.restore();
  text("#" + rank, 350, y + 2, 30, hot ? C.yellow : C.dim, { align: "left", glow: hot ? 14 : 2 });
  text(name, 560, y + 2, 34, C.text, { align: "left", glow: hot ? 16 : 4 });
  text(fmt(score), 1570, y + 2, 34, C.yellow, { align: "right", glow: hot ? 16 : 6 });
}
function scene5(t) {
  drawGhost("kimi", (25 + (t - T.rank)) * 1000, "btmc", 0.3);
  title("ENTRA AL TOP 50", t, T.rank + 0.1, C.cyan);
  const lt = t - T.rank, rowH = 92, top = 190, newRank = 4;
  const insert = clamp(outBack((lt - 1.0) / 0.7), 0, 1.12);
  BOARD_TOP.forEach((b, i) => drawRow(i + 1, b[0], b[1], top + i * rowH, false));
  BOARD_LOW.forEach((b, i) => drawRow(newRank + 1 + i, b[0], b[1], top + (newRank - 1 + i + insert) * rowH, false));
  if (lt > 1.0) {
    const ny = lerp(-120, top + (newRank - 1) * rowH, insert);
    const typed = lt > 2.2 ? clamp(Math.floor((lt - 2.2) / 0.42) + 1, 0, NAME.length) : 0;
    const cursor = typed < NAME.length && Math.floor(lt * 3) % 2 === 0 ? "_" : "";
    drawRow(newRank, NAME.slice(0, typed) + cursor, D.shiori.score, ny, true);
  }
  if (lt >= 5.6) {
    const q = outBack((lt - 5.6) / 0.4);
    if (lt - 5.6 < 0.15) { ctx.fillStyle = `rgba(255,210,63,${0.35 * (1 - (lt - 5.6) / 0.15)})`; ctx.fillRect(0, 0, W, H); }
    text("PUESTO #" + newRank, W / 2, 960, 56, C.yellow, { scale: lerp(0.5, 1, q), alpha: clamp((lt - 5.6) / 0.15), glow: 36 });
  }
}

// ---------- scene 6: tickets ----------
function ticketShape(x, y, rot, a = 1) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha *= a;
  ctx.fillStyle = C.yellow; ctx.shadowColor = C.yellow; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.roundRect(-34, -18, 68, 36, 6); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = "#07061a";
  ctx.beginPath(); ctx.arc(-34, 0, 7, 0, Math.PI * 2); ctx.arc(34, 0, 7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(7,6,26,0.5)"; ctx.setLineDash([5, 5]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-16, -12); ctx.lineTo(-16, 12); ctx.stroke();
  ctx.restore();
}
function scene6(t) {
  drawGhost("shiori", (75 + (t - T.tickets)) * 1000, "whitecat", 0.25);
  title("CANJEA TICKETS POR PREMIOS", t, T.tickets + 0.1, C.yellow);
  const lt = t - T.tickets, cardX = 560, cardY = 800, r = rng(404);
  for (let i = 0; i < 70; i++) {
    const t0 = 0.4 + i * 0.065, sxp = 200 + r() * 760, rot = (r() - 0.5) * 1.2, p = (lt - t0) / 0.9;
    if (p < 0 || p > 1) continue;
    const e = p * p;
    ticketShape(lerp(sxp, cardX, e), lerp(190, cardY - 30, e), rot * (1 - e), 1 - clamp((p - 0.85) / 0.15));
  }
  ctx.save();
  ctx.fillStyle = "rgba(18,16,46,0.95)"; ctx.strokeStyle = C.cyan; ctx.lineWidth = 4; ctx.shadowColor = C.cyan; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.roundRect(cardX - 280, cardY - 30, 560, 220, 22); ctx.fill(); ctx.stroke();
  ctx.restore();
  text("TARJETA UID ..A3F2", cardX, cardY + 20, 22, C.dim, { glow: 4 });
  text(fmt(3000 * outCubic((lt - 0.5) / 4.6)), cardX, cardY + 100, 60, C.yellow, { glow: 26 });
  text("TICKETS", cardX, cardY + 160, 20, C.text, { glow: 4 });
  const pp = outBack((lt - 5.4) / 0.6);
  if (lt > 5.4) {
    const off = lerp(900, 0, clamp(pp));
    ctx.save(); ctx.translate(off, 0); ctx.globalAlpha = clamp((lt - 5.4) / 0.3);
    ctx.fillStyle = "rgba(18,16,46,0.95)"; ctx.strokeStyle = C.pink; ctx.lineWidth = 4; ctx.shadowColor = C.pink; ctx.shadowBlur = 26;
    ctx.beginPath(); ctx.roundRect(1000, 300, 640, 520, 22); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = C.bg2; ctx.strokeStyle = C.cyan; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.roundRect(1200, 420, 240, 260, 40); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.cyan; ctx.beginPath(); ctx.arc(1260, 520, 20, 0, 7); ctx.arc(1380, 520, 20, 0, 7); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.translate(off, 0);
    text("FUNKO POP", 1320, 345, 34, C.text, {});
    text("3 000 TICKETS", 1320, 745, 30, C.yellow, {});
    ctx.restore();
    if (lt > 6.4) text("CANJEADO!", 1320 , 790, 22, C.lime, { alpha: Math.floor(lt * 4) % 2 ? 0.4 : 1 });
  }
}

// ---------- scene 7: call to action ----------
function scene7(t) {
  drawGhost("shiori", (85 + (t - T.cta)) * 1000, "azerite", 0.18);
  const lt = t - T.cta;
  drawLogo(W / 2, 330, 1000, clamp(lt / 0.4));
  const on = Math.floor(lt * 2) % 2 === 0 || lt < 0.5;
  text("INSERT COIN", W / 2, 600, 80, C.yellow, { alpha: on ? 1 : 0.15, glow: 40 });
  text("PASA TU TARJETA", W / 2, 720, 40, C.cyan, { alpha: on ? 1 : 0.15 });
  const slx = 1560, sly = 560;
  ctx.save();
  ctx.fillStyle = C.bg1; ctx.strokeStyle = C.pink; ctx.lineWidth = 5; ctx.shadowColor = C.pink; ctx.shadowBlur = 24 + 12 * Math.sin(lt * 6);
  ctx.beginPath(); ctx.roundRect(slx - 90, sly - 130, 180, 320, 20); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#000"; ctx.fillRect(slx - 8, sly - 20, 16, 90);
  ctx.restore();
  text("COIN", slx, sly - 90, 20, C.pink, { glow: 8 });
  const coins = [T.cta + 1.5, T.cta + 3.0, T.cta + 4.2];
  for (const t0 of coins) {
    const p = (t - t0) / 0.45;
    if (p >= 0 && p < 1) {
      const y = lerp(sly - 330, sly + 10, p * p);
      ctx.save(); ctx.fillStyle = C.yellow; ctx.shadowColor = C.yellow; ctx.shadowBlur = 20; ctx.globalAlpha = 1 - clamp((p - 0.85) / 0.15);
      ctx.beginPath(); ctx.ellipse(slx, y, 34 * (0.4 + 0.6 * Math.abs(Math.cos(p * 9))), 34, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    if (t >= t0 + 0.45 && t < t0 + 0.8) { ctx.fillStyle = `rgba(255,210,63,${0.25 * (1 - (t - t0 - 0.45) / 0.35)})`; ctx.fillRect(0, 0, W, H); }
  }
  const credits = coins.filter((c) => t >= c + 0.45).length;
  text("CREDITOS: " + credits * 3, 190, H - 80, 28, C.yellow, { align: "left" });
  text("3 JUGADAS POR DEPOSITO", W - 190, H - 80, 22, C.dim, { align: "right", glow: 4 });
}

// ---------- compositor ----------
const CUTS = [T.play, T.score, T.skins, T.rank, T.tickets, T.cta];
function wipe(t) {
  for (const b of CUTS) {
    const p = (t - (b - 0.22)) / 0.44;
    if (p > 0 && p < 1) {
      const x = -W + p * 2 * W, g = ctx.createLinearGradient(x, 0, x + W, 0);
      g.addColorStop(0, C.pink); g.addColorStop(0.7, C.pink); g.addColorStop(1, C.cyan);
      ctx.save(); ctx.fillStyle = g; ctx.fillRect(x, 0, W, H); ctx.restore();
    }
  }
}
window.renderAt = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  if (t < T.play) scene1(t);
  else {
    background(t, t < T.score ? "play" : "other");
    if (t < T.score) scene2(t);
    else if (t < T.skins) scene3(t);
    else if (t < T.rank) scene4(t);
    else if (t < T.tickets) scene5(t);
    else if (t < T.cta) scene6(t);
    else scene7(t);
  }
  wipe(t);
  overlay();
  const f = Math.min(clamp(t / 0.25), clamp((DURATION - t) / 0.5));
  if (f < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - f})`; ctx.fillRect(0, 0, W, H); }
};
window.ready = Promise.all([
  document.fonts.load("40px PS2P"),
  new Promise((res) => { if (logo.complete) res(); else logo.onload = res; }),
  new Promise((res) => { if (bgImg.complete) res(); else { bgImg.onload = res; bgImg.onerror = res; } }),
  ...loads,
]).then(() => { window.renderAt(0); return true; });
</script>
